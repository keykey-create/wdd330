<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>

        <form id="checkout-form">
          <fieldset>
            <legend>Customer Name</legend>
            <label for="fname">First Name</label>
            <input
              type="text"
              id="fname"
              name="fname"
              autocomplete="given-name"
              required
            />
            <label for="lname">Last Name</label>
            <input
              type="text"
              id="lname"
              name="lname"
              autocomplete="family-name"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <label for="street">Street Address</label>
            <input
              type="text"
              id="street"
              name="street"
              autocomplete="address-line1"
              required
            />
            <label for="city">City</label>
            <input
              type="text"
              id="city"
              name="city"
              autocomplete="address-level2"
              required
            />
            <label for="state">State</label>
            <input
              type="text"
              id="state"
              name="state"
              pattern="[A-Za-z]{2}"
              maxlength="2"
              placeholder="ID"
              autocomplete="address-level1"
              title="Enter the two-letter state abbreviation."
              required
            />
            <label for="zip">Zip Code</label>
            <input
              type="text"
              id="zip"
              name="zip"
              inputmode="numeric"
              pattern="[0-9]{5}"
              maxlength="5"
              autocomplete="postal-code"
              title="Enter a 5-digit ZIP code."
              required
            />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              inputmode="numeric"
              pattern="[0-9]{16}"
              maxlength="16"
              autocomplete="cc-number"
              title="Enter a 16-digit credit card number."
              required
            />
            <label for="expiration">Expiration Date</label>
            <input
              type="text"
              id="expiration"
              name="expiration"
              placeholder="MM/YY"
              pattern="(0?[1-9]|1[0-2])/[0-9]{2}"
              autocomplete="cc-exp"
              title="Enter the expiration date as MM/YY."
              required
            />
            <label for="code">Security Code</label>
            <input
              type="text"
              id="code"
              name="code"
              inputmode="numeric"
              pattern="[0-9]{3,4}"
              maxlength="4"
              autocomplete="cc-csc"
              title="Enter the 3- or 4-digit security code."
              required
            />
          </fieldset>

          <section class="order-summary">
            <h3>Order Summary</h3>
            <p>Items: <span id="item-count">0</span></p>
            <p>Subtotal: <span id="subtotal">$0.00</span></p>
            <p>Tax (6%): <span id="tax">$0.00</span></p>
            <p>Shipping Estimate: <span id="shipping">$0.00</span></p>
            <p class="order-total">
              Order Total: <span id="order-total">$0.00</span>
            </p>
          </section>

          <button type="submit">Checkout</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
